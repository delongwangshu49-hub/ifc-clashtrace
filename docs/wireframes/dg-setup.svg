<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc" data-fidelity="low">
  <title id="title">IFC ClashTrace low-fidelity setup-state wireframe</title>
  <desc id="desc">A desktop-first setup screen with product header, controlled example, two explicit IFC model inputs, supported-boundary checklist, run button, and disclaimers.</desc>
  <rect width="1440" height="900" fill="#f4f4f4"/>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#202020">
    <rect x="24" y="20" width="1392" height="64" rx="6" fill="#ffffff" stroke="#606060" stroke-width="2"/>
    <text x="52" y="60" font-size="24" font-weight="700">IFC ClashTrace</text>
    <text x="1050" y="57" font-size="16">○ 浏览器本地处理</text>
    <rect x="1260" y="35" width="124" height="34" rx="4" fill="#eeeeee" stroke="#606060"/>
    <text x="1286" y="58" font-size="15">边界与说明</text>

    <rect x="210" y="124" width="1020" height="690" rx="8" fill="#ffffff" stroke="#606060" stroke-width="2"/>
    <text x="270" y="190" font-size="30" font-weight="700">检查一份 MEP IFC 与一份结构 IFC</text>
    <text x="270" y="226" font-size="17">确定性硬碰撞与 &lt;50 mm 净距预警 · 结果可追溯至双方 GUID</text>

    <rect x="270" y="265" width="900" height="72" rx="6" fill="#eeeeee" stroke="#606060"/>
    <text x="300" y="296" font-size="17" font-weight="700">最快体验</text>
    <text x="300" y="320" font-size="15">使用已验证的程序生成案例，不需要选择本地文件</text>
    <rect x="930" y="283" width="210" height="38" rx="4" fill="#ffffff" stroke="#202020" stroke-width="2"/>
    <text x="970" y="308" font-size="16" font-weight="700">使用受控示例</text>

    <text x="270" y="383" font-size="16" font-weight="700">A · MEP 模型</text>
    <rect x="270" y="398" width="900" height="64" rx="4" fill="#ffffff" stroke="#707070"/>
    <text x="294" y="437" font-size="15">仅支持 IFC4 · 米制 · IfcPipeSegment</text>
    <rect x="980" y="411" width="160" height="38" rx="4" fill="#eeeeee" stroke="#303030"/>
    <text x="1018" y="436" font-size="15">选择 IFC</text>

    <text x="270" y="505" font-size="16" font-weight="700">B · 结构模型</text>
    <rect x="270" y="520" width="900" height="64" rx="4" fill="#ffffff" stroke="#707070"/>
    <text x="294" y="559" font-size="15">仅支持 IFC4 · 米制 · IfcWall / IfcBeam</text>
    <rect x="980" y="533" width="160" height="38" rx="4" fill="#eeeeee" stroke="#303030"/>
    <text x="1018" y="558" font-size="15">选择 IFC</text>

    <rect x="270" y="619" width="900" height="74" rx="4" fill="#f8f8f8" stroke="#8a8a8a" stroke-dasharray="5 4"/>
    <text x="294" y="648" font-size="15" font-weight="700">运行边界</text>
    <text x="294" y="676" font-size="14">IFC4  ·  metre  ·  shared project coordinates  ·  当前桌面 Chrome  ·  小型受控模型</text>

    <rect x="270" y="722" width="360" height="48" rx="5" fill="#dddddd" stroke="#202020" stroke-width="2"/>
    <text x="339" y="753" font-size="17" font-weight="700">运行确定性检查</text>
    <text x="660" y="742" font-size="13">未选择两个有效模型前不可用</text>
    <text x="660" y="765" font-size="13">文件留在浏览器；不是正式工程或法规认证。</text>
  </g>
  <text x="24" y="872" font-family="Arial, sans-serif" font-size="14" fill="#505050">DG LOW-FIDELITY · hierarchy only · no final color, spacing, icons, or components</text>
</svg>
