name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build client and Worker
        run: npm run build

      - name: Test deterministic engine
        run: node scripts/g3-engine-tests.mjs

      - name: Test application entry
        run: node scripts/g4-entry-tests.mjs

      - name: Test AI contracts with mock provider
        run: node scripts/g4ai-tests.mjs

      - name: Test Worker guards and fallback
        run: node scripts/g6-worker-tests.mjs

      - name: Verify public media metadata
        run: node scripts/g6-verify-media.mjs
